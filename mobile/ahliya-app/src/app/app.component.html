<ion-app>
  <ion-menu contentId="main" *ngIf="menus().length > 0">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>{{ userName() }}</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-note class="ion-padding">{{ role() }}</ion-note>
      <ion-list>
        <ion-menu-toggle *ngFor="let m of menus()">
          <ion-item (click)="go(m.route)">
            <ion-icon [name]="m.icon" slot="start"></ion-icon>
            <ion-label>{{ m.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle>
          <ion-item (click)="logout()">
            <ion-icon name="log-out" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
