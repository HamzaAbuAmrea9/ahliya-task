<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()"><ion-icon name="log-out"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h3>Hello {{ name }}</h3>
  <p>{{ role }}</p>

  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let m of menus">
        <ion-card (click)="open(m.route)" style="text-align:center">
          <ion-card-content>
            <ion-icon [name]="m.icon" style="font-size:36px"></ion-icon>
            <p>{{ m.title }}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
